openapi: 3.1.0
info:
  title: Tandemesh Control Plane API
  version: 0.1.0
  description: |
    Tandemesh is an agent execution plane. External systems (Jira, Linear, GitHub,
    Notion, Slack) remain the source of truth; Tandemesh stores only execution facts.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      summary: Liveness probe
      responses:
        "200": { description: OK }
  /readyz:
    get:
      summary: Readiness probe
      responses:
        "200": { description: Ready }
        "503": { description: Database unavailable }
  /api/v1/runs:
    get:
      summary: List runs
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 100 }
      responses:
        "200":
          description: Runs
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Run" }
    post:
      summary: Create a run
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRunRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
  /api/v1/runs/{id}:
    get:
      summary: Get a run
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "404": { description: Not found }
  /api/v1/runs/{id}/cancel:
    post:
      summary: Cancel a run
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Cancelled }
        "409": { description: Not cancellable }
  /api/v1/runs/{id}/events:
    get:
      summary: Stream run events (SSE)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: after
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: text/event-stream
          content:
            text/event-stream:
              schema: { type: string }
  /api/v1/machines:
    get:
      summary: List machines
      responses:
        "200":
          description: Machines
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Machine" }
  /api/v1/machines/register:
    post:
      summary: Register a machine
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterMachineRequest" }
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Machine" }
        "401": { description: Invalid join token }
  /api/v1/machines/{id}:
    delete:
      summary: Delete an offline machine
      description: Removes the host and its queued jobs. Runs keep their machine id as history.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "404": { description: Machine not found }
        "409": { description: Machine is online, or agents or connections still use it }
  /api/v1/machines/{id}/runtime-checks:
    post:
      summary: Ask a host to detect its agent runtimes again
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "202":
          description: Queued; poll the job until it is done or failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MachineJob" }
        "404": { description: Machine not found }
        "409": { description: Machine is not online }
  /api/v1/machines/{id}/acp-installs:
    post:
      summary: Install an ACP Registry agent on a host
      description: The host downloads and installs the agent into its own ACP home, then re-detects runtimes.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [registryId]
              properties:
                registryId: { type: string }
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MachineJob" }
        "400": { description: Invalid registry id }
        "404": { description: Machine not found }
        "409": { description: Machine is not online }
    delete:
      summary: Remove an ACP Registry agent from a host
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: registryId, in: query, required: true, schema: { type: string } }
        - { name: version, in: query, description: "Omit to remove every installed version", schema: { type: string } }
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MachineJob" }
        "400": { description: Invalid registry id or version }
        "404": { description: Machine not found }
        "409": { description: Machine is not online }
  /api/v1/acp/icons/{id}:
    get:
      summary: Get an ACP Registry agent's icon
      description: Fetched from the registry once and cached by the plane, so icons work offline. Only plain SVGs are served.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Single-colour SVG
          content:
            image/svg+xml:
              schema: { type: string }
        "400": { description: Invalid registry id }
        "404": { description: The registry lists no icon for this agent }
        "502": { description: The registry or icon could not be fetched or is unsafe }
  /api/v1/machine-jobs/{id}:
    get:
      summary: Get a machine job
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MachineJob" }
        "404": { description: Job not found }
  /api/v1/agentd/machine-jobs/{machineId}:
    get:
      summary: Claim pending jobs for a host (daemon only)
      parameters:
        - { name: machineId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Jobs now marked running
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/MachineJob" }
  /api/v1/agentd/machine-jobs/{machineId}/{id}:
    post:
      summary: Report a job result and the host's runtimes after it (daemon only)
      parameters:
        - { name: machineId, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [done, failed] }
                error: { type: string }
                result: { type: object }
                runtimes:
                  type: object
                  additionalProperties: { type: string }
                runtimeDetails:
                  type: array
                  items: { $ref: "#/components/schemas/RuntimeStatus" }
                agents:
                  type: array
                  items: { type: string }
      responses:
        "200": { description: Recorded }
        "404": { description: No running job with this id for this machine }
  /webhooks/github/{binding}:
    post:
      summary: GitHub issue webhook
      parameters:
        - name: binding
          in: path
          required: true
          schema: { type: string }
        - name: X-Hub-Signature-256
          in: header
          schema: { type: string }
        - name: X-GitHub-Delivery
          in: header
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "202": { description: Run created }
        "200": { description: Skipped or deduplicated }
        "401": { description: Bad signature }
  /api/v1/mobile/pairings:
    post:
      summary: Create a single-use mobile pairing code
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                workspaceId: { type: string }
      responses:
        "201":
          description: Pairing code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MobilePairing" }
        "401": { description: Local credential required }
  /api/v1/mobile/pairings/{id}:
    get:
      summary: Get pairing status
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Pairing status }
        "404": { description: Not found }
  /api/v1/mobile/pairings/exchange:
    post:
      summary: Exchange a pairing code for a device bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
                deviceName: { type: string }
                platform: { type: string }
      responses:
        "200":
          description: Device token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MobileTokenResponse" }
        "401": { description: Pairing code invalid or expired }
  /api/v1/mobile/devices:
    get:
      summary: List paired mobile devices
      responses:
        "200":
          description: Devices
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/MobileDevice" }
  /api/v1/mobile/devices/{id}:
    delete:
      summary: Revoke a paired mobile device
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Revoked }
        "404": { description: Not found }
components:
  schemas:
    WorkRef:
      type: object
      required: [provider, id]
      properties:
        provider: { type: string }
        instance: { type: string }
        type: { type: string }
        id: { type: string }
        url: { type: string }
        revision: { type: string }
    Snapshot:
      type: object
      properties:
        title: { type: string }
        bodyHash: { type: string }
        labels:
          type: array
          items: { type: string }
        author: { type: string }
    Run:
      type: object
      properties:
        id: { type: string }
        work: { $ref: "#/components/schemas/WorkRef" }
        snapshot: { $ref: "#/components/schemas/Snapshot" }
        agentId: { type: string }
        machineId: { type: string }
        status:
          type: string
          enum: [queued, leased, preparing, running, waiting_approval, finalizing, succeeded, failed, cancelled]
        priority: { type: integer }
        attempt: { type: integer }
        fence: { type: integer }
        repo: { type: string }
        base: { type: string }
        branch: { type: string }
        prompt: { type: string }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        endedAt: { type: string, format: date-time, nullable: true }
    CreateRunRequest:
      type: object
      required: [work]
      properties:
        work: { $ref: "#/components/schemas/WorkRef" }
        agentId: { type: string, default: claude }
        repo: { type: string }
        base: { type: string, default: main }
        branch: { type: string }
        prompt: { type: string }
        priority: { type: integer }
    Machine:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        labels:
          type: array
          items: { type: string }
        agents:
          type: array
          items: { type: string }
        runtimes:
          type: object
          description: Backends the host can run now, mapped to their version
          additionalProperties: { type: string }
        runtimeDetails:
          type: array
          items: { $ref: "#/components/schemas/RuntimeStatus" }
        concurrency: { type: integer }
        status: { type: string }
        lastSeen: { type: string, format: date-time }
    RuntimeStatus:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        name: { type: string }
        status: { type: string, enum: [ready, adapter-missing, missing, unsupported] }
        version: { type: string }
        cli: { type: string, description: Resolved path of the agent CLI }
        launcher: { type: string, description: ACP command the host starts, or would start }
        source: { type: string, enum: [flag, custom, registry, path] }
        registryId: { type: string }
        registryVersion: { type: string }
    MachineJob:
      type: object
      properties:
        id: { type: string }
        machineId: { type: string }
        kind: { type: string, enum: [runtime-check, acp-install, acp-uninstall] }
        payload: { type: object }
        status: { type: string, enum: [pending, running, done, failed] }
        result: { type: object }
        error: { type: string }
        requestedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
    RegisterMachineRequest:
      type: object
      required: [token, name]
      properties:
        token: { type: string }
        name: { type: string }
        labels:
          type: array
          items: { type: string }
        agents:
          type: array
          items: { type: string }
        concurrency: { type: integer }
        version: { type: string }
    MobilePairing:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        expiresAt: { type: integer, format: int64 }
    MobileDevice:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        platform: { type: string }
        createdAt: { type: integer, format: int64 }
        lastUsedAt: { type: integer, format: int64 }
        revokedAt: { type: integer, format: int64 }
    MobileTokenResponse:
      type: object
      properties:
        token: { type: string }
        device: { $ref: "#/components/schemas/MobileDevice" }
        user: { type: string }
