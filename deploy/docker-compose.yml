services:
  plane:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      TANDEMESH_LISTEN: ":8080"
      TANDEMESH_DB_PATH: ${TANDEMESH_DB_PATH:-/data/tandemesh.db}
      TANDEMESH_JOIN_TOKEN: ${TANDEMESH_JOIN_TOKEN:-dev-join-token}
      TANDEMESH_GITHUB_SECRET: ${TANDEMESH_GITHUB_SECRET:-}
      TANDEMESH_LEASE_TTL: 30s
    ports:
      - "8080:8080"
    volumes:
      - orca-data:/data
    restart: unless-stopped

  # Optional Postgres for team deployments:
  #   docker compose --profile postgres up
  #   TANDEMESH_DB_PATH=postgres://orca:orca@postgres:5432/orca?sslmode=disable
  postgres:
    image: postgres:17-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: orca
      POSTGRES_PASSWORD: orca
      POSTGRES_DB: orca
    ports:
      - "5432:5432"
    volumes:
      - orca-pg:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  orca-data:
  orca-pg:
