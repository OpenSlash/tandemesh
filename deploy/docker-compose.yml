services:
  plane:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      ORCA_LISTEN: ":8080"
      ORCA_DB_PATH: ${ORCA_DB_PATH:-/data/orca.db}
      ORCA_JOIN_TOKEN: ${ORCA_JOIN_TOKEN:-dev-join-token}
      ORCA_GITHUB_SECRET: ${ORCA_GITHUB_SECRET:-}
      ORCA_LEASE_TTL: 30s
    ports:
      - "8080:8080"
    volumes:
      - orca-data:/data
    restart: unless-stopped

  # Optional Postgres for team deployments:
  #   docker compose --profile postgres up
  #   ORCA_DB_PATH=postgres://orca:orca@postgres:5432/orca?sslmode=disable
  postgres:
    image: postgres:17-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: orca
      POSTGRES_PASSWORD: orca
      POSTGRES_DB: orca
    ports:
      - "5432:5432"
    volumes:
      - orca-pg:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  orca-data:
  orca-pg:
